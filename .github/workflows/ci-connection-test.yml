
name: Databricks CI Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ci-connection:
    name: Verify CI Service Principal
    runs-on: ubuntu-latest
    environment: ci

    defaults:
      run:
        working-directory: marketing_dbt

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install dbt-core==1.12.5 dbt-databricks==1.12.6

      - name: Configure dbt CI profile
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<'EOF'
          marketing_dbt:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: marketing_ci
                schema: silver
                host: "{{ env_var('DATABRICKS_HOST') }}"
                http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
                client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
                client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
                threads: 2
          EOF

          chmod 600 ~/.dbt/profiles.yml

      - name: Install dbt packages
        run: dbt deps

      - name: Test Databricks connection
        run: dbt debug --target ci

      - name: Verify CI identity
        run: dbt run-operation verify_connection_identity --target ci

      - name: Verify shared Bronze access
        run: dbt run-operation verify_bronze_access --target ci
