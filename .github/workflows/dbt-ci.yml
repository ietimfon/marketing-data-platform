
name: dbt Pull Request CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dbt-ci:
    name: Build and Test dbt
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ci

    defaults:
      run:
        working-directory: marketing_dbt

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DBT_CI_PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install dbt-core==1.12.5 dbt-databricks==1.12.6

      - name: Configure CI dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          marketing_dbt:
            target: ci
            outputs:
              ci:
                type: databricks
                auth_type: oauth
                catalog: marketing_ci
                schema: silver
                host: "{{ env_var('DATABRICKS_HOST') }}"
                http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
                client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
                client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
                threads: 2
          EOF
          chmod 600 ~/.dbt/profiles.yml

      - name: Install packages
        run: dbt deps

      - name: Verify connection
        run: dbt debug --target ci

      - name: Verify PR schema routing
        run: |
          dbt parse --target ci
          python - <<'PY'
          import json
          import os

          with open("target/manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)

          pr = os.environ["DBT_CI_PR_NUMBER"]
          checks = {
              "model.marketing_dbt.stg_facebook_ads_stats": f"pr_{pr}_silver",
              "model.marketing_dbt.fct_marketing_spend": f"pr_{pr}_gold",
          }

          for node_id, expected_schema in checks.items():
              node = manifest["nodes"][node_id]
              assert node["database"] == "marketing_ci", node_id
              assert node["schema"] == expected_schema, node_id
              print(f"{node['name']}: marketing_ci.{expected_schema}")
          PY

      - name: Initialize Elementary monitoring
        run: dbt run --select package:elementary --target ci --threads 2

      - name: Build and test marketing models
        run: dbt build --select package:marketing_dbt,resource_type:model --target ci --threads 2

      - name: Upload dbt execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-results-${{ github.event.pull_request.number }}
          path: |
            marketing_dbt/target/run_results.json
            marketing_dbt/target/manifest.json
          if-no-files-found: warn
          retention-days: 7
